services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-tracker-api:local
    ports:
      - "3010:3010"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3010
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
